name: picpos_van
description: PicPos cash-van Android app (Phase I) — offline-first, Arabic RTL default.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.6.0
  path: ^1.9.1
  sqflite: ^2.4.2
  uuid: ^4.5.2
  mobile_scanner: ^7.4.2
  connectivity_plus: ^7.3.2
  flutter_secure_storage: ^11.2.0
  sqflite_sqlcipher: ^3.4.1
  print_bluetooth_thermal: ^1.2.1
  barcode: ^2.2.9
  picpos_rules:
    path: ../packages/picpos_rules

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    # Receipt print font (same as desktop printing: NotoNaskhArabic, full Arabic shaping).
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
