name: PicPos ERP CI

# ── Triggers ────────────────────────────────────────────────────────────────
# Every branch push + every pull request run the full verification pipeline.
# Version tags (v*.*.*) additionally run build-windows + release.
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

# One run per ref; a newer push cancels the older run (never cancel a tag run —
# a half-finished release is worse than a slow one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; only `release` (and gitleaks' PR read) widen it.
permissions:
  contents: read

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  FLUTTER_VERSION: '3.41.x'   # Pin to the version used in development (3.41.2 stable, Dart 3.11)

# Jobs (all independent => run in parallel, except where `needs` is stated):
#   secrets | gitleaks | root_static | root_tests (8 file-shards) | packages_and_mobile | server | web
#   coverage_gate  <- root_tests (merges shard coverage, ≥ 18 % gate)
#   e2e            <- secrets, packages_and_mobile, server   (does NOT wait for the root suite)
#   build-windows  <- secrets, root_static, root_tests, coverage_gate, packages_and_mobile,
#                     server, web, e2e                                      (main / v*.*.* only)
#   release        <- build-windows                                         (v*.*.* only)
jobs:
# ═══════════════════════════════════════════════════════════════════════════════
# (أ) Secrets — our own tracked-secret-file check (no license needed)
# ═══════════════════════════════════════════════════════════════════════════════
  secrets:
    name: 🔒 Secrets check
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fails if *.jks / *.keystore / key.properties / google-services.json /
      # Firebase service-account JSON is tracked, or the ignore rules for them
      # are missing. (tool/check_no_secrets.ps1 is force-added despite *.ps1
      # being git-ignored.)
      - name: Run tool/check_no_secrets.ps1
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/check_no_secrets.ps1

  # Optional content scan. gitleaks-action@v2 needs GITLEAKS_LICENSE only for
  # organisation-owned repos; for a personal repo it is free. It is advisory
  # (never blocks the pipeline) so a missing license cannot turn CI red.
  gitleaks:
    name: 🔎 Gitleaks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # only needed for org repos

# ═══════════════════════════════════════════════════════════════════════════════
# (ب) Root app — static checks (fast) + sharded tests + merged coverage gate
# ═══════════════════════════════════════════════════════════════════════════════
  root_static:
    name: 🔍 Root (analyze + God-File gates)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Codegen is NOT run in CI. The only generated artifact,
      # lib/data/database/database.g.dart, is committed and kept current on any
      # schema change (regenerate + commit locally). build_runner cost ~49 min
      # on the free runner. analyze/test/build compile fine from the committed
      # part file.

      # ── Static analysis ────────────────────────────────────────────────────
      - name: Analyze code (strict)
        run: flutter analyze lib/

      # ── God-File size gates ────────────────────────────────────────────────
      # Each threshold is the MAXIMUM allowed byte size.
      # Lower the threshold when a file is refactored; never raise it.
      # client_write_interceptor.dart keeps its public entrypoint small; domain
      # implementations live in interceptor/ parts.
      - name: Check God-File size thresholds
        shell: bash
        run: |
          declare -A THRESHOLDS
          THRESHOLDS["lib/presentation/screens/tables_screen.dart"]=70000
          THRESHOLDS["lib/presentation/pos/screens/pos_table_service_screen.dart"]=70000
          THRESHOLDS["lib/services/client_write_interceptor.dart"]=2000   # entrypoint only; implementation lives in interceptor/ parts
          THRESHOLDS["lib/services/interceptor/cwi_admin.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_catalog.dart"]=1000
          THRESHOLDS["lib/services/interceptor/cwi_catalog_operations.dart"]=23000
          THRESHOLDS["lib/services/interceptor/cwi_catalog_products.dart"]=10000
          THRESHOLDS["lib/services/interceptor/cwi_commerce.dart"]=19000
          THRESHOLDS["lib/services/interceptor/cwi_core.dart"]=28000
          THRESHOLDS["lib/services/interceptor/cwi_core_support.dart"]=26000
          THRESHOLDS["lib/services/interceptor/cwi_sync.dart"]=1000
          THRESHOLDS["lib/services/interceptor/cwi_sync_catalog.dart"]=16000
          THRESHOLDS["lib/services/interceptor/cwi_sync_foundation.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_sync_orders.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_trading.dart"]=2000
          THRESHOLDS["lib/services/interceptor/cwi_trading_inventory.dart"]=8000
          THRESHOLDS["lib/services/interceptor/cwi_trading_papers.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_trading_purchases.dart"]=17000
          THRESHOLDS["lib/services/interceptor/cwi_trading_sales.dart"]=13000
          THRESHOLDS["lib/data/database/daos/treasury_voucher_dao.dart"]=39000
          THRESHOLDS["lib/services/api/api_data_handler.dart"]=240307
          THRESHOLDS["lib/data/database/daos/treasury_dao.dart"]=171000
          THRESHOLDS["lib/services/api/api_handler.dart"]=191133

          FAILED=0
          for file in "${!THRESHOLDS[@]}"; do
            threshold="${THRESHOLDS[$file]}"
            if [ -f "$file" ]; then
              # Count bytes with LF endings: the Windows runner checks files out
              # as CRLF, but the thresholds are measured on the LF blobs in git.
              size=$(tr -d '\r' < "$file" | wc -c | tr -d ' ')
              if [ "$size" -gt "$threshold" ]; then
                echo "❌ GOD-FILE: $file  (${size} bytes > threshold ${threshold})"
                FAILED=1
              else
                echo "✅ OK: $file  (${size} bytes ≤ ${threshold})"
              fi
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

  # ── Full test suite, split into parallel shards ───────────────────────────
  # The single-job run took ~1h55m on the runner and hit the job timeout.
  # `flutter test --total-shards/--shard-index` did NOT help: every shard still
  # loads/compiles ALL ~1276 test files on a 2-core runner. So the suite is
  # split BY FILE instead: each shard lists test/**/*_test.dart (minus
  # test/e2e) in a fixed `sort` order, takes every 8th file (round-robin) and
  # passes only those files to `flutter test`. Every file runs in exactly one
  # shard. 8 shards => ~160 paths (~9 000 chars) per command line, far below the
  # Windows 32 767-char limit. Each shard is BOTH a pass/fail gate and a
  # coverage source; the `coverage_gate` job merges the per-shard lcov files.
  root_tests:
    name: 🧪 Root tests (shard ${{ matrix.shard }}/8)
    # Windows desktop app — run the suite on the SAME platform it targets and is
    # developed/verified on. Several integration/timing tests are Windows-tuned
    # (and the golden images are Windows-generated).
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TOTAL_SHARDS: '8'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # test/e2e/ is excluded here: it spawns the cloud server and needs
      # Postgres, which Windows runners cannot host (no service containers);
      # it runs in the `e2e` job on ubuntu instead. test/integration_pg/ files
      # are tagged `pg` and skipped by dart_test.yaml.
      # --reporter=github keeps the log small (groups + failures only) instead
      # of printing every test line as `expanded` did (>73k lines).
      # Deterministic file split: LC_ALL=C sort => identical order in all shards;
      # file number i (0-based) belongs to shard (i % TOTAL_SHARDS) + 1.
      - name: Select this shard's test files
        shell: bash
        run: |
          set -euo pipefail
          idx=$(( ${{ matrix.shard }} - 1 ))
          find test -type f -name '*_test.dart' -not -path 'test/e2e/*' | LC_ALL=C sort > all_tests.txt
          awk -v n="$TOTAL_SHARDS" -v s="$idx" '(NR-1) % n == s' all_tests.txt > shard_tests.txt
          total=$(wc -l < all_tests.txt | tr -d ' ')
          mine=$(wc -l < shard_tests.txt | tr -d ' ')
          chars=$(wc -c < shard_tests.txt | tr -d ' ')
          echo "Shard ${{ matrix.shard }}/${TOTAL_SHARDS}: ${mine} of ${total} test files (~${chars} chars of paths)"
          if [ "$mine" -eq 0 ]; then
            echo "::error::No test files assigned to this shard"
            exit 1
          fi
          if [ "$chars" -gt 25000 ]; then
            echo "::error::Shard path list (${chars} chars) risks the Windows command-line limit; raise the shard count"
            exit 1
          fi

      - name: Run test shard with coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(tr -d '\r' < shard_tests.txt)
          flutter test --coverage --reporter=github "${files[@]}"

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# (ب2) Coverage gate — merge the shard lcov files and enforce the floor
# ═══════════════════════════════════════════════════════════════════════════════
  coverage_gate:
    name: 📊 Coverage gate (merged)
    needs: [root_tests]
    if: ${{ !cancelled() && needs.root_tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: shard-coverage

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Merge with lcov; if lcov rejects the (Windows-path) files, fall back to
      # a plain merge that keeps, per (file, line), the max hit count.
      - name: Merge coverage
        shell: bash
        run: |
          set -u
          mapfile -t files < <(find shard-coverage -name lcov.info | sort)
          echo "Shard files: ${files[*]:-<none>}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shard lcov.info files were downloaded"
            exit 1
          fi
          args=()
          for f in "${files[@]}"; do args+=(-a "$f"); done
          if lcov "${args[@]}" -o merged.info \
               --ignore-errors inconsistent,unsupported,format,corrupt,empty,unused \
               >lcov_merge.log 2>&1 && [ -s merged.info ]; then
            echo "Merged with lcov"
          else
            echo "::warning::lcov merge failed — falling back to python merge"
            tail -n 20 lcov_merge.log || true
            python3 - "${files[@]}" <<'PY'
          import sys
          from collections import OrderedDict
          data = OrderedDict()  # file -> {line: hits}
          for path in sys.argv[1:]:
              cur = None
              with open(path, encoding="utf-8", errors="replace") as fh:
                  for raw in fh:
                      line = raw.strip()
                      if line.startswith("SF:"):
                          cur = data.setdefault(line[3:], {})
                      elif line.startswith("DA:") and cur is not None:
                          parts = line[3:].split(",")
                          try:
                              ln, hits = int(parts[0]), int(parts[1])
                          except (ValueError, IndexError):
                              continue
                          cur[ln] = max(cur.get(ln, 0), hits)
                      elif line == "end_of_record":
                          cur = None
          with open("merged.info", "w", encoding="utf-8") as out:
              for sf, lines in data.items():
                  out.write("SF:%s\n" % sf)
                  for ln in sorted(lines):
                      out.write("DA:%d,%d\n" % (ln, lines[ln]))
                  hit = sum(1 for h in lines.values() if h > 0)
                  out.write("LF:%d\nLH:%d\nend_of_record\n" % (len(lines), hit))
          PY
            echo "Merged with python"
          fi
          ls -l merged.info

      # Regression FLOOR, not an aspiration. Measured line coverage is ~21%
      # (the denominator includes the generated database.g.dart + all UI
      # screens). 18% sits just below reality with headroom: it catches a
      # coverage crater without failing on normal fluctuation. RATCHET IT UP as
      # real coverage grows.
      - name: Coverage hard gate (≥ 18 %)
        shell: bash
        run: |
          if [ ! -f merged.info ]; then
            echo "::error::No merged.info found — coverage merge did not run"
            exit 1
          fi
          TOTAL=$(grep -c "^DA:" merged.info 2>/dev/null || echo "0")
          HIT=$(grep "^DA:" merged.info | grep -v ",0$" | wc -l || echo "0")
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(( HIT * 100 / TOTAL ))
            echo "Coverage: ${PCT}%  (${HIT} / ${TOTAL} lines)"
            if [ "$PCT" -lt 18 ]; then
              echo "::error::Coverage ${PCT}% < 18% floor — coverage regressed, add tests"
              exit 1
            fi
          else
            echo "::warning::Could not determine coverage (0 DA lines found)"
          fi

      - name: Upload merged coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_number }}
          path: merged.info
          if-no-files-found: ignore
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# (ج) Shared package + mobile apps — pub get / analyze / test (no signing keys)
# mobile* depend on packages/* via `path:` deps; the whole repo is checked out,
# so `pub get` resolves them in place. test/e2e is left to the `e2e` job.
# Windows runner: mobile_admin / mobile_pos golden PNGs are Windows-generated
# and platform-sensitive.
# ═══════════════════════════════════════════════════════════════════════════════
  packages_and_mobile:
    name: 📦 ${{ matrix.dir }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: packages/picpos_api_client
            tool: dart      # pure Dart package (no Flutter dependency)
          - dir: mobile
            tool: flutter
          - dir: mobile_admin
            tool: flutter
          - dir: mobile_pos
            tool: flutter

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: ${{ matrix.tool }} pub get

      - name: Analyze
        run: ${{ matrix.tool }} analyze

      - name: Test (excluding test/e2e)
        run: |
          targets=()
          for p in test/*; do
            [ "$p" = "test/e2e" ] && continue
            if [ -d "$p" ]; then
              [ -n "$(find "$p" -name '*_test.dart' -print -quit)" ] && targets+=("$p")
            else
              case "$p" in *_test.dart) targets+=("$p");; esac
            fi
          done
          echo "Test targets: ${targets[*]}"
          ${{ matrix.tool }} test "${targets[@]}"

# ═══════════════════════════════════════════════════════════════════════════════
# (د) Cloud server — Postgres service container + dart test -j 1
# Service containers need a Linux runner. Host port 55432 matches the
# harness/docker-compose defaults (server/test/support/harness.dart); the
# TEST_DB_* values are still set explicitly to stay robust.
# ═══════════════════════════════════════════════════════════════════════════════
  server:
    name: 🖥️ Server (dart analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '55432'
      TEST_DB_NAME: picpos_cloud
      TEST_DB_USER: picpos
      TEST_DB_PASSWORD: picpos_test_only   # throwaway CI-only DB credential, same as docker/docker-compose.yml

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: picpos_cloud
          POSTGRES_USER: picpos
          POSTGRES_PASSWORD: picpos_test_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U picpos -d picpos_cloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test (serial - tests share one Postgres)
        run: dart test -j 1

# ═══════════════════════════════════════════════════════════════════════════════
# (هـ) E2E — real cloud server (subprocess) + Postgres, driven from each client
# tool/run_e2e.ps1 is NOT used: it hard-codes Windows `\` paths (broken for
# pwsh on Linux) and a Docker-compose Postgres. The same suites are invoked
# directly with the identical commands it uses (see docs/testing/E2E.md).
# `web` suite is skipped here: it needs no Postgres and already runs in `root_tests`.
# ═══════════════════════════════════════════════════════════════════════════════
  e2e:
    name: 🔗 E2E (Linux + Postgres)
    needs: [secrets, packages_and_mobile, server]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '55432'
      TEST_DB_NAME: picpos_cloud
      TEST_DB_USER: picpos
      TEST_DB_PASSWORD: picpos_test_only   # throwaway CI-only DB credential

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: picpos_cloud
          POSTGRES_USER: picpos
          POSTGRES_PASSWORD: picpos_test_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U picpos -d picpos_cloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # drift/sqlite3 in-memory databases used by the root e2e tests.
      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # e2e_cloud.dart launches `dart run test/e2e/support/e2e_server.dart` in
      # server/, so server deps must be resolved first.
      - name: Install server dependencies
        working-directory: server
        run: dart pub get

      - name: Run E2E suites
        shell: bash
        run: |
          set -u
          mkdir -p build/e2e_logs
          declare -A RESULTS
          ORDER=()

          # name  dir  tool  [args...]  — flutter suites retry on the known
          # startup-lock / native_assets copy races (same as run_e2e.ps1).
          run_suite() {
            local name="$1" dir="$2" tool="$3"; shift 3
            local log="$GITHUB_WORKSPACE/build/e2e_logs/$name.log"
            local attempts=1; [ "$tool" = "flutter" ] && attempts=3
            local rc=1
            ORDER+=("$name")
            for a in $(seq 1 "$attempts"); do
              echo "══════ [$name] $tool $* (attempt $a/$attempts) ══════"
              ( cd "$dir" && "$tool" "$@" ) 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
              [ "$rc" -eq 0 ] && break
              if [ "$tool" = "flutter" ] && grep -qE 'PathExistsException|release the startup lock|Cannot copy file to|FileSystemException: Cannot' "$log"; then
                echo "transient flutter conflict — retrying"; sleep $((15 * a))
              else
                break
              fi
            done
            RESULTS[$name]=$rc
          }

          run_suite server       server                      dart    test -j 1 test/e2e
          (cd packages/picpos_api_client && dart pub get)
          run_suite packages     packages/picpos_api_client  dart    test test/e2e
          run_suite mobile       mobile                      flutter test test/e2e
          run_suite mobile_admin mobile_admin                flutter test test/e2e
          run_suite mobile_pos   mobile_pos                  flutter test test/e2e
          run_suite root         .                           flutter test test/e2e

          echo; echo "══════ E2E summary ══════"
          bad=0
          for n in "${ORDER[@]}"; do
            if [ "${RESULTS[$n]}" -eq 0 ]; then echo "PASS  $n"; else echo "FAIL  $n"; bad=1; fi
          done
          exit $bad

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-${{ github.run_number }}
          path: build/e2e_logs/
          if-no-files-found: ignore
          retention-days: 14

# ═══════════════════════════════════════════════════════════════════════════════
# (و) Web — compile the root web entrypoint and publish build/web
# ═══════════════════════════════════════════════════════════════════════════════
  web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: >-
          flutter build web --release
          --no-tree-shake-icons --no-wasm-dry-run
          -t lib/main_web_entry.dart

      - name: Upload web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PicPos-ERP-web-${{ github.run_number }}
          path: build/web
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# (ز) Windows release build — main branch and version tags only
# ═══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🏗️ Build Windows
    needs: [secrets, root_static, root_tests, coverage_gate, packages_and_mobile, server, web, e2e]
    runs-on: windows-latest
    # `flutter build windows --release` cold-compiles the C++ runner + Dart AOT
    # on a free runner; headroom so the release-gating build isn't cut short.
    timeout-minutes: 60
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')

    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Codegen is NOT run in CI (see `root_static` job): database.g.dart is committed.

      # ── Version stamp ──────────────────────────────────────────────────────
      # Artifact name format: PicPos-ERP-<semver>+<short-sha>-windows
      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          SEMVER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          SHORT_SHA=${GITHUB_SHA::8}
          FULL="${SEMVER}+${SHORT_SHA}"
          echo "semver=${SEMVER}"       >> "$GITHUB_OUTPUT"
          echo "full-version=${FULL}"   >> "$GITHUB_OUTPUT"
          echo "artifact-name=PicPos-ERP-${FULL}-windows" >> "$GITHUB_OUTPUT"
          echo "Building: PicPos-ERP ${FULL}"

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --build-name="${{ steps.meta.outputs.semver }}"
          --build-number="${{ github.run_number }}"

      # ── Package as zip ─────────────────────────────────────────────────────
      - name: Package artifact
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $name = "${{ steps.meta.outputs.artifact-name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\${name}.zip" -Force
          Write-Host "Packaged: dist\${name}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: dist/*.zip
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# GitHub Release (version tags only: v*.*.*)
# Creates a GitHub Release and attaches the Windows zip.
#
# Web is now compiled by the root app's web entrypoint (lib/main_web_entry.dart,
# see the `web` job) and its build/web output is uploaded as a CI artifact on
# every run. The release itself still attaches only the Windows zip; the web
# bundle is not a release input.
# ═══════════════════════════════════════════════════════════════════════════════
  release:
    name: 🚀 Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PicPos-ERP ${{ github.ref_name }}"
          files: release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
