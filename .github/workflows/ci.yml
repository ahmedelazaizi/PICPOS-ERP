name: URAL-ERP CI/CD

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  FLUTTER_VERSION: '3.41.x'   # Pin to the version used in development (Dart 3.11)
  DART_SDK_CONSTRAINT: '3.11.0'

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 0 — Secrets scan (runs first; cheapest fail-fast gate)
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  secrets-scan:
    name: 🔒 Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits on the PR

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # omit for public repos

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — Analysis & Tests
# ═══════════════════════════════════════════════════════════════════════════════
  verify:
    name: 🔍 Verify & Test
    # Windows desktop app — run the suite on the SAME platform it targets and is
    # developed/verified on. Several integration/timing tests are Windows-tuned
    # and are flaky on ubuntu; matching the platform keeps CI == local.
    runs-on: windows-latest
    needs: secrets-scan
    # Drift build_runner codegen on the full schema + the whole test suite are
    # slow on a cold free runner. The suite now runs ONCE (single --coverage
    # pass; see below), but coverage instrumentation over ~3k tests plus codegen
    # still needs headroom on a free Windows runner. 120 > observed worst case.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Codegen is NOT run in CI. The only generated artifact,
      # lib/data/database/database.g.dart, is committed and kept current on any
      # schema change (regenerate + commit locally). build_runner cost ~49 min
      # on the free runner — nearly half the verify budget — and also overran
      # the build-windows/build-web timeouts. analyze/test/build compile fine
      # from the committed part file.

      # ── Static analysis ────────────────────────────────────────────────────
      - name: Analyze code (strict)
        run: flutter analyze lib/

      # ── God-File size gates ────────────────────────────────────────────────
      # Each threshold is the MAXIMUM allowed byte size.
      # Lower the threshold when a file is refactored; never raise it.
      # client_write_interceptor.dart keeps its public entrypoint small; domain
      # implementations live in interceptor/ parts.
      - name: Check God-File size thresholds
        shell: bash
        run: |
          declare -A THRESHOLDS
          THRESHOLDS["lib/presentation/screens/tables_screen.dart"]=70000
          THRESHOLDS["lib/presentation/pos/screens/pos_table_service_screen.dart"]=70000
          THRESHOLDS["lib/services/client_write_interceptor.dart"]=2000   # entrypoint only; implementation lives in interceptor/ parts
          THRESHOLDS["lib/services/interceptor/cwi_admin.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_catalog.dart"]=1000
          THRESHOLDS["lib/services/interceptor/cwi_catalog_operations.dart"]=23000
          THRESHOLDS["lib/services/interceptor/cwi_catalog_products.dart"]=10000
          THRESHOLDS["lib/services/interceptor/cwi_commerce.dart"]=19000
          THRESHOLDS["lib/services/interceptor/cwi_core.dart"]=28000
          THRESHOLDS["lib/services/interceptor/cwi_core_support.dart"]=26000
          THRESHOLDS["lib/services/interceptor/cwi_sync.dart"]=1000
          THRESHOLDS["lib/services/interceptor/cwi_sync_catalog.dart"]=16000
          THRESHOLDS["lib/services/interceptor/cwi_sync_foundation.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_sync_orders.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_trading.dart"]=2000
          THRESHOLDS["lib/services/interceptor/cwi_trading_inventory.dart"]=8000
          THRESHOLDS["lib/services/interceptor/cwi_trading_papers.dart"]=13000
          THRESHOLDS["lib/services/interceptor/cwi_trading_purchases.dart"]=17000
          THRESHOLDS["lib/services/interceptor/cwi_trading_sales.dart"]=13000
          THRESHOLDS["lib/data/database/daos/treasury_voucher_dao.dart"]=39000
          THRESHOLDS["lib/services/api/api_data_handler.dart"]=240307
          THRESHOLDS["lib/data/database/daos/treasury_dao.dart"]=171000
          THRESHOLDS["lib/services/api/api_handler.dart"]=191133

          FAILED=0
          for file in "${!THRESHOLDS[@]}"; do
            threshold="${THRESHOLDS[$file]}"
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              if [ "$size" -gt "$threshold" ]; then
                echo "❌ GOD-FILE: $file  (${size} bytes > threshold ${threshold})"
                FAILED=1
              else
                echo "✅ OK: $file  (${size} bytes ≤ ${threshold})"
              fi
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      # ── Full test suite + coverage (single pass) ───────────────────────────
      # ONE instrumented run of the whole test/ tree: it is BOTH the pass/fail
      # gate and the coverage source. Previously the suite ran ~twice — 7
      # per-directory steps + 2 standalone "mandatory flow" file steps + a
      # separate `flutter test --coverage` — each step also recompiling the test
      # bundle. Even an all-green run then blew past the job timeout during the
      # trailing coverage step (run #16). A single pass ~halves the work with
      # zero coverage loss; a failure still names the exact failing file:test.
      - name: Run full test suite with coverage
        run: flutter test --coverage --reporter=expanded

      # Regression FLOOR, not an aspiration. Measured line coverage is ~21%
      # (the denominator includes the generated database.g.dart + all UI
      # screens). The old 35% target had never actually executed — every prior
      # run cancelled/failed upstream — so it silently blocked green. 18% sits
      # just below reality with headroom: it catches a coverage crater without
      # failing on normal fluctuation. RATCHET IT UP as real coverage grows.
      - name: Coverage hard gate (≥ 18 %)
        shell: bash
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::No coverage/lcov.info found — did flutter test --coverage run?"
            exit 1
          fi
          TOTAL=$(grep -c "^DA:" coverage/lcov.info 2>/dev/null || echo "0")
          HIT=$(grep "^DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo "0")
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(( HIT * 100 / TOTAL ))
            echo "Coverage: ${PCT}%  (${HIT} / ${TOTAL} lines)"
            if [ "$PCT" -lt 18 ]; then
              echo "::error::Coverage ${PCT}% < 18% floor — coverage regressed, add tests"
              exit 1
            fi
          else
            echo "::warning::Could not determine coverage (0 DA lines found)"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/lcov.info
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — Windows release build
# Runs on main / master / develop pushes and on version tags.
# ═══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🏗️ Build Windows
    needs: verify
    runs-on: windows-latest
    # `flutter build windows --release` cold-compiles the C++ runner + Dart AOT
    # on a free runner; headroom so the release-gating build isn't cut short.
    timeout-minutes: 60
    if: |
      github.ref == 'refs/heads/main'    ||
      github.ref == 'refs/heads/master'  ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/v')

    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Codegen is NOT run in CI. The only generated artifact,
      # lib/data/database/database.g.dart, is committed and kept current on any
      # schema change (regenerate + commit locally). build_runner cost ~49 min
      # on the free runner — nearly half the verify budget — and also overran
      # the build-windows/build-web timeouts. analyze/test/build compile fine
      # from the committed part file.

      # ── Version stamp ──────────────────────────────────────────────────────
      # Artifact name format: URAL-ERP-<semver>+<short-sha>
      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          SEMVER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          SHORT_SHA=${GITHUB_SHA::8}
          FULL="${SEMVER}+${SHORT_SHA}"
          echo "semver=${SEMVER}"       >> "$GITHUB_OUTPUT"
          echo "full-version=${FULL}"   >> "$GITHUB_OUTPUT"
          echo "artifact-name=URAL-ERP-${FULL}-windows" >> "$GITHUB_OUTPUT"
          echo "Building: URAL-ERP ${FULL}"

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --build-name="${{ steps.meta.outputs.semver }}"
          --build-number="${{ github.run_number }}"

      # ── Package as zip ─────────────────────────────────────────────────────
      - name: Package artifact
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $name = "${{ steps.meta.outputs.artifact-name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\${name}.zip" -Force
          Write-Host "Packaged: dist\${name}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: dist/*.zip
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — GitHub Release (version tags only: v*.*.*)
# Creates a GitHub Release and attaches the Windows zip.
#
# There is deliberately NO web build job. The root app is a Windows/FFI desktop
# target (Aclas SDK, serial_port_win32) that does not compile under dart2js
# ("Only JS interop members may be 'external'"); the web deliverable lives in the
# separate web_app/ project. The release attaches only the Windows artifact, so
# a web build was never a release input — it was a spurious gate.
# ═══════════════════════════════════════════════════════════════════════════════
  release:
    name: 🚀 Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "URAL-ERP ${{ github.ref_name }}"
          files: release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
