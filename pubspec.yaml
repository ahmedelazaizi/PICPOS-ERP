name: ural_erp
description: "UralCash ERP - نظام إدارة موارد المؤسسات"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.2.1+264

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.30.0
  rxdart: ^0.28.0  # Spec 115 — debounceTime على parties streams (مُرقَّى من transitive إلى direct)
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.5
  flutter_riverpod: ^3.1.0
  go_router: ^17.0.1
  google_fonts: ^8.1.0
  intl: ^0.20.2
  crypto: ^3.0.7
  cryptography: ^2.7.0          # Argon2id for password hashing (Week 8)
  pdf: ^3.11.3
  printing: ^5.14.2
  phosphor_flutter: ^2.1.0
  fl_chart: ^1.1.1
  file_picker: ^11.0.2
  shared_preferences: ^2.5.4
  package_info_plus: ^9.0.1
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  serial_port_win32: ^2.3.0  # For COM port scale communication
  excel: ^4.0.6
  window_manager: ^0.5.1
  state_notifier: ^1.0.0
  supabase_flutter: ^2.8.0  # Supabase for web database
  device_info_plus: ^12.4.0
  logger: ^2.6.2
  # ⚠️ لا تُعِد `sqlite3` اعتماداً مباشراً — كانت هنا وتُظلِّل SQLCipher.
  #
  # الحزمةُ تحمل `hook/build.dart` يُنزِل نسخةَ sqlite3 **عاديّةً** يضعها
  # native-assets بجانب الـexe باسم `sqlite3.dll` نفسِه، فتحلّ محلَّ نسخة
  # `sqlcipher_flutter_libs`. النتيجةُ المقيسة (2026-08-30): الـDLL المشحونة
  # ١٫٦ م.ب (‏عاديّة) لا ٥٫٤ (‏SQLCipher)، و`PRAGMA key` تُتجاهَل بصمت،
  # والقاعدةُ الحيّةُ نصٌّ صريح.
  #
  # و`drift` تجلبها انتقاليّاً على أيّ حال، ولم يكن في `lib/` ولا `test/`
  # استيرادٌ واحدٌ لـ`package:sqlite3` — فالإعلانُ المباشرُ كان بلا فائدة.
  # والحارسُ في زمن التشغيل `PRAGMA cipher_version` في `connection_io.dart`.
  ffi: ^2.1.3               # FFI helpers (Pointer<Utf8>, calloc) for native scale SDKs
  shimmer: ^3.0.0
  # Cluster 024 / Issue 1 (perf) — virtualized DataTable2. The standard
  # Flutter DataTable builds every row eagerly, so screens with 500+
  # rows (inventory, products, parties, journal lines) stutter on
  # scroll and freeze for seconds while paint catches up. DataTable2
  # is a drop-in API replacement that uses ListView.builder for rows.
  data_table_2: ^2.5.16
  shelf: ^1.4.2           # Embedded HTTP server for multi-device
  shelf_router: ^1.1.4    # REST API routing
  ftpconnect: ^2.0.10     # FTP client for PLU file upload to scales
  flutter_zkteco: ^1.2.0   # ZKTeco fingerprint device TCP communication
  flutter_secure_storage: ^9.2.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  drift_postgres: ^1.3.1    # Drift QueryExecutor for PostgreSQL
  postgres: ^3.4.0           # PostgreSQL driver for direct TCP connections
  audioplayers: ^6.6.0
  uuid: ^4.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.4
  # Transitive via path_provider, declared explicitly so tests can swap
  # `PathProviderPlatform.instance` for a fake. Needed because the Windows
  # implementation is pure Dart (win32) rather than a method channel, so
  # the usual `setMockMethodCallHandler` trick doesn't reach it.
  path_provider_platform_interface: ^2.1.2
  analyzer: ^10.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/i18n/en.json
    - assets/i18n/catalog_ar.json
    # لوجو UralCash — في الجذر لأسباب تاريخية؛ الكود بيوصله عبر
    # Brand.logoAsset مش بسلسلة مكتوبة.
    - logo.PNG
    # أصول العلامات المستقلة — ملفات مفردة، **مش** المجلد.
    #
    # `assets/brand/picpos/` كان بيحزم `app_icon.ico` (٣٦٤ ك.ب) كذلك، وهي
    # مطلوبة وقت البناء فقط (مورد Win32 من
    # `windows/runner/resources/app_icon_picpos.ico`) ومالهاش أي استخدام
    # وقت التشغيل. اللوجو هو الأصل الوحيد اللي الكود بيقراه.
    #
    # ملاحظة: الحزم بيتحدد من pubspec وقت البناء، فأصول كل العلامات بتتحزم
    # في كل بناء. اللي بيتعرض بيتحدد من Brand.logoAsset — مفيش خلط بصري،
    # بس كل علامة جديدة بتزوّد بضع كيلوبايت على كل المنتجات.
    - assets/brand/picpos/logo.png
    - assets/invoice_templates/
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Medium.ttf
    - assets/fonts/Cairo-SemiBold.ttf
    - assets/fonts/Cairo-Bold.ttf
    - assets/fonts/Cairo-ExtraBold.ttf
    - assets/fonts/Cairo-Black.ttf
    - assets/fonts/Cairo-OFL.txt
    # ── خطُّ الطباعة ─────────────────────────────────────────────────────────
    # Noto Naskh Arabic **الكامل** (‏static، ١٩٩ ك.ب) — أساسُ كلّ مطبوع.
    # ترخيصُه OFL (‏`NotoNaskhArabic-OFL.txt`) فالتوزيعُ مسموح.
    #
    # وكان المحزومُ قبله نسخةً **عربيةً مقصوصة** (١٤٦ ك.ب) بلا حرفٍ لاتينيٍّ
    # واحد — مقيس: ينقصها ٥٢ حرفاً لاتينياً و٧ علاماتٍ منها `/` و`(` و`%`.
    # فكان رقمُ الفاتورة نفسُه `SINV-24` يخرج مربّعاتٍ لولا الاحتياطيّ.
    #
    # وCairo على الجهة الأخرى ينقصه ١٦ من أشكال العرض العربية و٥ من
    # العربية الأساسية، ومنها **الياءُ المنفصلة U+FEF1** — فكلُّ اسمٍ آخرُه ي
    # بعد حرفٍ غيرِ موصول (صبري · بدري · المصري) كان يُطبع ناقصاً.
    #
    # فلا واحدٌ منهما كان كافياً، والخلطُ بينهما كان يمسخ الكلمات. الأصلُ
    # الكاملُ يُغني عن الاحتياطيّ كلَّه — انظر `BaseGenerator.newDocument`.
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    # وزنٌ عريضٌ حقيقيّ — الحزمةُ لا تصطنع العريض، فبلا هذا كان `FontWeight.bold`
    # يسقط على الوزن العاديّ بلا أثر.
    - assets/fonts/NotoNaskhArabic-Bold.ttf
    - assets/audio/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
