[system]
// 传输超时 (Transfer timeout per attempt, ms). Lowered 2000 → 1000.
// Per-item uploads are fast (<500ms on LAN); 1000ms is more than enough
// headroom while keeping failure detection quick.
SyncTimeOut=1000
//传输尝试次数 (Transfer retry count). Lowered 5 → 2.
// Each per-item PLU upload goes through this retry loop, so keeping it
// low is critical: 12 items × 2 retries × 1 sec = 24 sec worst case.
SyncTryCount=2
//获取设备超时 (Device discovery timeout per attempt, ms).
GetDeviceTimeOut=1500
//获取设备尝试次数 (Device discovery retries). Raised 1 → 3 (بلاغ العميل
// 2026-07-30: «في أوقات الميزان مش بيتم اكتشافه رغم أن الـ IP سليم»).
//
// الكشف يتم عبر **UDP** — بروتوكول بلا ضمان تسليم. محاولة واحدة بمهلة
// 1500ms معناها أن **ضياع حزمة واحدة = «الميزان غير موجود»**، والميزان
// شغّال والـ IP صحيح. وده بالضبط شكل العطل المتقطّع: يشتغل مرة ويفشل
// مرة على نفس الإعداد. التعليق القديم «1 retry is enough on a LAN» صحيح
// على شبكة سلكية هادئة فقط — ويسقط مع Wi‑Fi أو سويتش مزدحم أو ميزان
// مشغول بالطباعة لحظة الاستعلام.
//
// الكشف يحدث **مرة واحدة** في بداية الجلسة (وليس لكل صنف مثل
// SyncTryCount)، فتكلفة الرفع من 1 إلى 3 هي ثوانٍ معدودة في أسوأ حالة
// فشل كامل — مقابل إزالة أكثر أسباب الفشل المتقطّع شيوعاً.
GetDeviceTryCount=3
//升级程序超时
UpdateFirmwareTimeOut=10000
//升级程序尝试次数
UpdateFirmwareTryCount=10


[Function]
//6.197之前版本的M3秤的通讯模式。0：自动侦测 1：按LH51通讯 2：按M3秤通讯。
//OldM3Mode=2

//M3 Name1扩充到80字节
//ExpandName1=1

//强制条码类型，若为空则不强制条码类型。如下面强制条码类型为94
//ForceBarcode1=94

//名称三个减号删除PLU的启用标志 
//Minus2Delete=1  

//强制Flag1，若为空则不强制Flag1。如下面强制Flag1为16,参见DLL开发手册可知是Bit4置1，即打印保质期
ForceFlag1=60

//强制Flag2，若为空则不强制Flag2。如下面强制Flag2为32,参见DLL开发手册可知是Bit5置1，即打印Note1
ForceFlag2=240

//强制Flag3，若为空则不强制Flag3。如下面强制Flag3为1,参见DLL开发手册可知是Bit0置1，即溯源商品
//ForceFlag3=1

