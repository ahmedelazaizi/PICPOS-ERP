name: picpos_pos
description: >-
  PicPos Cashier («PicPos كاشير») — offline tablet POS Android app, LAN client
  of the main desktop (docs/mobile/ARCHITECTURE-M.md, M-B). Phase M-0: app
  shell only.
publish_to: 'none'

# versionName = x.y.z, versionCode = N (strictly increasing, per app).
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2
  picpos_api_client:
    path: ../packages/picpos_api_client
  picpos_device:
    path: ../packages/picpos_device
  picpos_rules:
    path: ../packages/picpos_rules
  picpos_ui:
    path: ../packages/picpos_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icons: sources generated by tool/mobile_icons/make_icons.py, then
# `dart run flutter_launcher_icons` (outputs under android/app/src/main/res).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/legacy.png
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
